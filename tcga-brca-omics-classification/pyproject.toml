[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcga-brca-transcriptomics-ml"
version = "1.1.0"
description = "Leakage-aware machine learning and biological interpretation of TCGA-BRCA transcriptomics"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Laya Parkavousi"}
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "scikit-learn>=1.0",
  "joblib>=1.1",
  "matplotlib>=3.4",
  "statsmodels>=0.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.24",
  "jupyter>=1.0",
  "nbformat>=5.7"
]
serve = [
  "fastapi>=0.100",
  "uvicorn>=0.23"
]
bio = [
  "gprofiler-official>=1.0.0"
]

[project.scripts]
tcga-brca-predict = "tcga_brca.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
